<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <defs>
    <linearGradient id="qaydGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BA8A2" />
      <stop offset="100%" stop-color="#1E8C86" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD23F" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E8C86" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Icon -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#qaydGrad)" filter="url(#shadow)"/>
    
    <!-- Printing Press Paper Feed Symbol -->
    <rect x="22" y="16" width="36" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="16" y="27" width="48" height="28" rx="7" fill="#142826" opacity="0.15"/>
    <rect x="18" y="28" width="44" height="25" rx="6" fill="#ffffff"/>
    
    <!-- Cyan, Magenta, Yellow, Key Dots -->
    <circle cx="28" cy="37" r="3" fill="#00A3E0"/>
    <circle cx="36" cy="37" r="3" fill="#EC008C"/>
    <circle cx="44" cy="37" r="3" fill="#FFD23F"/>
    <circle cx="52" cy="37" r="3" fill="#142826"/>
    
    <!-- Paper Sheet Coming Out Bottom -->
    <rect x="22" y="47" width="36" height="20" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <line x1="28" y1="54" x2="46" y2="54" stroke="#1E4D48" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="60" x2="52" y2="60" stroke="#1E4D48" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: Arabic Brand Name -->
  <g transform="translate(105, 20)">
    <text x="0" y="38" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="34" fill="#1E8C86" letter-spacing="-0.5">
      قَيْــــد
    </text>
    <rect x="90" y="16" width="112" height="24" rx="12" fill="#FFF8E7" stroke="#FFE47A" stroke-width="1.5"/>
    <text x="146" y="32" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="11" fill="#D45233" text-anchor="middle">
      الخواض للطباعة
    </text>
    
    <text x="0" y="60" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="12" fill="#5F7D7A">
      حلول الطباعة المتكاملة • ديجيتال وأوفست
    </text>
  </g>
</svg>
